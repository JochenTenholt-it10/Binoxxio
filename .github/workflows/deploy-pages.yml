name: Deploy Binoxxo to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Service Worker Cache automatisch aktualisieren
        run: |
          if [ -f sw.js ]; then
            sed -i "s/const CACHE_NAME = '.*';/const CACHE_NAME = 'binoxxo-it10-${{ github.run_number }}-${{ github.sha }}';/" sw.js
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
